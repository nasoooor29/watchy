{{ define "base" }}
<!doctype html>
<html lang="en" class="bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ block "title" . }}Hanashi{{ end }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { accent: { 400: '#a78bfa', 500: '#8b5cf6' } } } }
      };
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  </head>
  <body class="min-h-screen bg-slate-950 font-sans text-slate-100 antialiased">
    <main class="min-h-screen p-4 sm:p-8" hx-boost="true" hx-push-url="true" hx-target="main" hx-swap="innerHTML">
      {{ block "content" . }}{{ end }}
    </main>
  </body>
</html>
{{ end }}
