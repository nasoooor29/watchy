{{ define "episode-row" }}
<sl-card class="episode">
  <style>
    .episode::part(body) {
      padding: 0.85rem;
    }
    .episode-title,
    .episode-sources {
      display: flex;
      gap: 0.75rem;
    }
    .episode-title {
      align-items: center;
      justify-content: space-between;
    }
    .episode-name {
      margin: 0;
      font-size: 0.9rem;
    }
    .episode-sources {
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }
  </style>
  <div class="episode-title">
    <p class="episode-name">{{ .Name }}</p>
    {{ if .Watched }}
    <sl-button size="small" variant="success">watched</sl-button>
    {{ else }}
    <sl-button size="small">Mark watched</sl-button>
    {{ end }}
  </div>
  <div class="episode-sources">
    {{ range .Sources }}
    <sl-button size="small" href="mpv://http://localhost:8080/shows/{{ $.ID }}/stream/{{ .Path }}">
      <sl-icon name="play-fill" slot="prefix"></sl-icon>
      {{ .Label }}
    </sl-button>
    {{ end }}
  </div>
</sl-card>
{{ end }}
