{{ define "episode-row" }}
<sl-card class="episode"
  ><div class="episode-title">
    <p class="episode-name">{{ .Name }}</p>
    {{ if .Watched }}<sl-badge variant="success" pill>Watched</sl-badge>{{ else
    }}<sl-button size="small" pill>Mark watched</sl-button>{{ end }}
  </div>
  <div class="source-actions">
    {{ range .Sources }}<sl-button size="small"
      ><sl-icon name="play-fill" slot="prefix"></sl-icon>{{ .Label }}</sl-button
    >{{ end }}
  </div></sl-card
>
{{ end }}
