{{ define "show-panel" }}
<style>
  .episodes::part(body) {
    padding: 1rem;
  }
  .section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .section-heading h2,
  .section-heading p {
    margin: 0;
  }
  .section-heading h2 {
    color: var(--ctp-text);
    font-size: 1.125rem;
  }
  .subtle {
    margin-top: 0.25rem !important;
    color: var(--sl-color-neutral-400);
    font-size: 0.875rem;
  }
  .episode-list {
    display: grid;
    gap: 0.5rem;
  }
</style>
<div>{{ template "show-detail" . }}</div>

<sl-card class="episodes">
  <div class="section-heading">
    <div>
      <h2>Seasons &amp; episodes</h2>
      <p class="subtle">Pick an available release to start watching.</p>
    </div>

    <sl-badge>{{ .EpisodeCount }} episodes</sl-badge>
  </div>
  {{ if .Season.Episodes }}
  <sl-details open summary="{{ .Season.Name }}">
    <div class="episode-list">
      {{ range .Season.Episodes }} {{ template "episode-row" . }} {{ end }}
    </div>
  </sl-details>
  {{ end }}
</sl-card>
{{ end }}
