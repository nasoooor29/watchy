{{ define "library-toolbar" }}
<style>
  .library-toolbar {
    display: flex;
    gap: 0.75rem;
    margin-top: 1rem;
  }
  .library-toolbar sl-input {
    flex: 1;
  }
  .library-toolbar sl-select {
    width: 11rem;
  }
  .library-toolbar sl-switch {
    align-self: center;
    white-space: nowrap;
  }
  @media (max-width: 540px) {
    .library-toolbar {
      flex-wrap: wrap;
    }
    .library-toolbar sl-select {
      width: 100%;
    }
  }
</style>
<div class="library-toolbar">
  <sl-input
    type="search"
    placeholder="Search your library"
    aria-label="Search library"
    size="small"
  >
    <sl-icon name="search" slot="prefix"></sl-icon>
  </sl-input>
  <sl-switch class="library-search-mode" size="small" checked>
  </sl-switch>

  <sl-select value="latest-ep" aria-label="Sort library" size="small">
    <sl-option value="latest-ep">Recently updated</sl-option>
    <sl-option value="percent">Progress</sl-option>
    <sl-option value="alpha">Alphabetical</sl-option>
  </sl-select>


  <sl-icon-button
    name="arrow-clockwise"
    label="Refresh library"
  ></sl-icon-button>
</div>

<script>
  function sortLibrary(select) {
    const grid = document.querySelector('.library-grid');
    if (!grid) return;

    const cards = [...grid.children].filter((card) => card.matches('.library-card'));

    cards.sort((left, right) => {
      if (select.value === 'alpha') {
        return (left.dataset.title || '').localeCompare(right.dataset.title || '');
      }

      const field = select.value === 'percent' ? 'percent' : 'latestep';
      return (Number(right.dataset[field]) || 0) - (Number(left.dataset[field]) || 0);
    });

    grid.replaceChildren(...cards);
  }

  function filterLibrary(input) {
    const grid = document.querySelector('.library-grid');
    if (!grid) return;

    const nativeInput = input.shadowRoot?.querySelector('input');
    const query = String(input.value || nativeInput?.value || '').trim().toLowerCase();
    const advanced = document.querySelector('.library-search-mode')?.checked;

    for (const card of grid.children) {
      if (!card.matches('.library-card')) continue;

      let visible;
      if (!query) {
        visible = true;
      } else if (advanced) {
        visible = matchesExpression(card, query);
      } else {
        visible = Object.values(card.dataset).some((value) =>
          String(value).toLowerCase().includes(query)
        );
      }

      card.style.display = visible ? '' : 'none';
    }
  }

  function matchesExpression(card, expression) {
    return expression.split('||').some((alternative) =>
      alternative.split('&&').every((condition) => matchesCondition(card, condition.trim()))
    );
  }

  function matchesCondition(card, condition) {
    const match = condition.match(/^([\w-]+)\s*(<=|>=|!=|=|<|>|~)\s*(.*)$/);
    if (!match) return false;

    const [, field, operator, expectedValue] = match;
    const actual = (card.dataset[field] || '').toLowerCase();
    const expected = expectedValue.toLowerCase();

    switch (operator) {
      case '~':
        return actual.includes(expected);
      case '=':
        return actual === expected;
      case '!=':
        return actual !== expected;
      case '<':
      case '>':
      case '<=':
      case '>=': {
        const actualNumber = Number(actual);
        const expectedNumber = Number(expected);
        if (!Number.isFinite(actualNumber) || !Number.isFinite(expectedNumber)) return false;
        if (operator === '<') return actualNumber < expectedNumber;
        if (operator === '>') return actualNumber > expectedNumber;
        if (operator === '<=') return actualNumber <= expectedNumber;
        return actualNumber >= expectedNumber;
      }
      default:
        return false;
    }
  }

  function bindLibrarySort(root = document) {
    const select = root.querySelector('.library-toolbar sl-select');
    if (!select) return;

    if (!select.dataset.sortBound) {
      select.dataset.sortBound = 'true';
      select.addEventListener('sl-change', () => sortLibrary(select));
    }
    sortLibrary(select);
  }

  function bindLibrarySearch(root = document) {
    const input = root.querySelector('.library-toolbar sl-input');
    if (!input || input.dataset.searchBound) return;

    input.dataset.searchBound = 'true';
    input.addEventListener('sl-input', () => filterLibrary(input));
    input.addEventListener('input', () => filterLibrary(input));
  }

  bindLibrarySort();
  bindLibrarySearch();
  customElements.whenDefined('sl-input').then(() => bindLibrarySearch());
  document.addEventListener('DOMContentLoaded', () => bindLibrarySort());
  document.addEventListener('DOMContentLoaded', () => bindLibrarySearch());
  document.addEventListener('sl-change', (event) => {
    if (event.target.matches('.library-toolbar sl-select')) sortLibrary(event.target);
    if (event.target.matches('.library-search-mode')) {
      const input = document.querySelector('.library-toolbar sl-input');
      if (input) filterLibrary(input);
    }
  });
  document.addEventListener('htmx:afterSettle', () => {
    bindLibrarySort();
    bindLibrarySearch();
  });
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.querySelector('.library-toolbar sl-input');
    if (input) filterLibrary(input);
  });
</script>
{{ end }}
