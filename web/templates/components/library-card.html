{{ define "library-card" }}
<sl-card class="library-card"
  {{ range $name, $value := metadataAttributes .Metadata }}data-{{ $name }}="{{ $value }}"{{ end }}
>
  <style>
    .library-card {
      height: 10.25rem;
      cursor: pointer;
    }
    .library-card::part(base) {
      height: 100%;
    }
    .library-card::part(body) {
      height: 100%;
      padding: 0.5rem;
    }
    .library-card-content {
      display: flex;
      height: 100%;
      gap: 0.5rem;
      padding: 0.25rem;
    }
    .library-card-cover {
      flex: 0 0 6rem;
      width: 6rem;
      height: 100%;
      overflow: hidden;
      border-radius: var(--sl-border-radius-medium);
      background: linear-gradient(135deg, var(--ctp-mauve), var(--ctp-pink));
    }
    .library-card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .library-card-info {
      display: flex;
      min-width: 0;
      flex: 1;
      flex-direction: column;
    }
    .library-card-badges {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.35rem;
      margin-bottom: 0.35rem;
    }
    .library-card-title {
      display: -webkit-box;
      overflow: hidden;
      color: var(--ctp-text);
      font-size: 1rem;
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .library-card-meta {
      margin: 0.35rem 0 0;
      color: var(--sl-color-neutral-400);
      font-size: 0.75rem;
    }
  </style>
<div 
    class="library-card-content cursor-pointer"
    hx-get="/shows/{{ .Path }}" 
    hx-target="#show-panel" 
    hx-swap="innerHTML"
    hx-push-url="/shows/{{ .Path }}"
  >
    <div class="library-card-cover">
      <img
        src="{{ .Metadata.Image }}"
        alt="{{ .Metadata.Title }} cover"
        loading="lazy"
        onerror="this.onerror=null;this.src='/public/fallback.svg'"
      />
    </div>
    <div class="library-card-info">
      <div class="library-card-badges">
        {{ if .Metadata.Progress }}<sl-badge variant="primary">{{ .Metadata.Progress }}</sl-badge>{{ end }}
      </div>
      <h2 class="library-card-title">{{ .Metadata.Title }}</h2>
    </div>
  </div>
</sl-card>
{{ end }}
