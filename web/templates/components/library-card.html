{{ define "library-card" }}
<article class="group overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/70 shadow-sm transition hover:-translate-y-0.5 hover:border-violet-400/50 hover:bg-slate-900">
  <div class="flex gap-2.5 p-2.5">
    <div class="relative h-24 w-[4.5rem] shrink-0 overflow-hidden rounded-xl bg-gradient-to-br from-violet-500 to-fuchsia-600">
      {{ if .Image }}
      <img src="{{ .Image }}" alt="{{ .Title }} cover" class="h-full w-full object-cover" loading="lazy" />
      {{ else }}
      <span class="flex h-full items-center justify-center text-2xl font-black text-white/80">{{ printf "%.1s" .Title }}</span>
      {{ end }}
    </div>
    <div class="min-w-0 flex-1 py-0.5">
      <div class="flex items-start justify-between gap-2">
        <h2 class="line-clamp-2 text-sm font-semibold leading-5 text-white">{{ .Title }}</h2>
        <span class="shrink-0 rounded-md bg-amber-400/10 px-1.5 py-0.5 text-xs font-semibold text-amber-300">★ {{ printf "%.2f" .Score }}</span>
      </div>
      <p class="mt-1.5 text-xs text-slate-400">{{ .Year }} · {{ .Progress }}</p>
      <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-slate-800" aria-label="{{ .Percent }} percent watched">
        <div class="h-full rounded-full bg-gradient-to-r from-violet-500 to-fuchsia-400" style="width: {{ .Percent }}%"></div>
      </div>
    </div>
  </div>
</article>
{{ end }}
