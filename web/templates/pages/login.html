{{ define "title" }}Sign in · Hanashi{{ end }} {{ define "content" }}
<section class="auth-shell">
  <sl-card class="auth-card" id="auth-card"
    ><h1>Welcome back</h1>
    <p class="subtle">Sign in to continue your conversations.</p>
    {{ if .Error }}<sl-alert variant="danger" open>{{ .Error }}</sl-alert>{{ end
    }}
    <form
      method="post"
      action="/login"
      hx-post="/login"
      hx-target="#auth-card"
      hx-select="#auth-card"
      hx-swap="outerHTML"
    >
      <sl-input
        label="Email address"
        name="email"
        type="email"
        autocomplete="email"
        value="{{ .Email }}"
        placeholder="you@example.com"
        required
      ></sl-input
      ><sl-input
        label="Password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        password-toggle
      ></sl-input
      ><sl-button type="submit" variant="primary">Sign in</sl-button>
    </form>
    <footer>
      <span class="muted"
        >New to Hanashi? <a href="/register">Create an account</a>.</span
      >
    </footer></sl-card
  >
</section>
{{ end }}
