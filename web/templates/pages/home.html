{{ define "title" }}Library · Watchy{{ end }} {{ define "content" }}
<style>
  .library-page {
    max-width: 1600px;
    margin: 0 auto;
  }

  .library-layout {
    display: grid;
    gap: 0.5rem;
  }

  .library-sidebar,
  .library-content {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 1rem;
  }

  .library-header::part(body) {
    padding: 1rem;
  }

  .library-page h1,
  .library-page h2,
  .library-page p {
    margin: 0;
  }

  .library-page h1 {
    color: var(--ctp-text);
    font-size: 1.5rem;
  }

  .library-page h2 {
    color: var(--ctp-text);
    font-size: 1.125rem;
  }

  .subtle,
  .muted {
    color: var(--sl-color-neutral-400);
  }

  .subtle {
    margin-top: 0.25rem !important;
    font-size: 0.875rem;
  }

  .library-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.5rem;
    overflow-y: auto;
    padding-right: 0.125rem;
  }

  @media (min-width: 1100px) {
    .library-layout {
      grid-template-columns: minmax(34rem, 2fr) minmax(36rem, 3fr);
      height: calc(100vh - 2rem);
    }

    .library-sidebar {
      overflow: hidden;
    }

    .library-content {
      overflow-y: auto;
      padding-right: 0.125rem;
    }
  }

  @media (max-width: 540px) {
    .library-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
<div class="library-page">
  <div class="library-layout">
    <aside class="library-sidebar">
      {{ template "library-toolbar" . }}

      <div class="library-grid">
        {{ range .Shows }} {{ template "library-card" . }} {{ end }}
      </div>
    </aside>

    <div class="library-content" id="show-panel">
      {{ if .Show }}{{ template "show-panel" .Show }}{{ end }}
    </div>
  </div>
</div>
{{ end }}
