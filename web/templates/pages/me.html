{{ define "title" }}My account · Watchy{{ end }} {{ define "content" }}
<section class="account-card">
  <sl-card
    ><h1>Your account</h1>
    <p class="subtle">Your account details.</p>
    <table>
      <tr>
        <th>Name</th>
        <td>{{ .Name }}</td>
      </tr>
      <tr>
        <th>Email address</th>
        <td>{{ .Email }}</td>
      </tr>
    </table></sl-card
  ><sl-card
    ><h2>Account</h2>
    <p class="subtle">You can sign out of this device at any time.</p>
    <form method="post" action="/logout">
      <sl-button class="sign-out" type="submit" variant="neutral" outline
        >Sign out</sl-button
      >
    </form></sl-card
  >
</section>
{{ end }}
