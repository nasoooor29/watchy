{{ define "title" }}Create account · Watchy{{ end }} {{ define "content" }}
<section class="auth-shell">
  <sl-card class="auth-card" id="auth-card"
    ><h1>Create your account</h1>
    <p class="subtle">A calmer place for better conversations.</p>
    {{ if .Error }}<sl-alert variant="danger" open>{{ .Error }}</sl-alert>{{ end
    }}
    <form
      method="post"
      action="/register"
      hx-post="/register"
      hx-target="#auth-card"
      hx-select="#auth-card"
      hx-swap="outerHTML"
    >
      <sl-input
        label="Your name"
        name="name"
        autocomplete="name"
        value="{{ .Name }}"
        placeholder="Your name"
        required
      ></sl-input
      ><sl-input
        label="Email address"
        name="email"
        type="email"
        autocomplete="email"
        value="{{ .Email }}"
        placeholder="you@example.com"
        required
      ></sl-input
      ><sl-input
        label="Password"
        name="password"
        type="password"
        autocomplete="new-password"
        required
        password-toggle
      ></sl-input
      ><sl-button type="submit" variant="primary">Create account</sl-button>
    </form>
    <footer>
      <span class="muted"
        >Already have an account? <a href="/login">Sign in</a>.</span
      >
    </footer></sl-card
  >
</section>
{{ end }}
