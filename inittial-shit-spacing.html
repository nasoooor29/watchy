<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="dark bg-gray-800">
    <div class="flex gap-4 min-h-dvh min-w-dvw p-4">
      <div class="bg-gray-900 w-2/5 flex flex-col gap-4">
        <div class="bg-red-400 min-h-1/5 p-4 flex gap-4 w-full justify-between">
          <div id="summary" class="w-full">
            <div class="flex justify-between">
              <h1>Library</h1>
              <button class="bg-blue-500 text-white p-2">Refresh</button>
            </div>
            <h3>300 series</h3>
            <div id="filters">
              <div class="flex gap-2">
                <input
                  type="text"
                  class="bg-gray-700 text-white p-1 rounded-sm w-5/6"
                  placeholder="Search..."
                />
                <select
                  class="bg-gray-700 text-white p-1 rounded-sm w-2/6"
                  name="sort"
                  id="sort"
                >
                  <option value="alpha">Alphabetical</option>
                  <option value="date">Date</option>
                  <option value="rating">Rating</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div class="bg-blue-200 h-full">
          <div class="grid grid-cols-2 gap-2 p-2">
            <div class="bg-gray-700 p-2 rounded-sm flex">
              <div>
                <img
                  src="http://localhost:3000/api/series-cover?name=Yomi%20no%20Tsugai"
                  alt=""
                  class="aspect-2/3 max-w-30"
                />
              </div>
              <div class="flex flex-col gap-2 p-2">
                <h3>Yomi no Tsugai</h3>
                <div id="tags" class="flex">
                  <div class="bg-green-400 px-3 p-0.5 rounded-sm text-sm">
                    rating
                  </div>
                  <div class="bg-green-400 px-3 p-0.5 rounded-sm text-sm">
                    Year
                  </div>
                </div>
                <div id="summary">
                  <p>
                    Lorem ipsum dolor sit amet consectetur adipisicing elit.
                    Quisquam, quod.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="bg-gray-900 w-3/5 flex flex-col gap-4">
        <div class="bg-red-400 h-full gap-2 p-2 flex">
          <div class="bg-blue-200 w-1/5 flex flex-col gap-2 items-stretch">
            <img
              src="http://localhost:3000/api/series-cover?name=Yomi%20no%20Tsugai"
              alt="Anime Cover"
              class="aspect-2/3 w-full bg-muted object-cover"
            />
            <button class="bg-blue-500 text-white w-full p-1 text-sm">
              Star
            </button>
            <button class="bg-blue-500 text-white w-full p-1 text-sm">
              Watch
            </button>
          </div>
          <div class="bg-blue-400 w-4/5 p-2 flex flex-col gap-2">
            <h1>Title Im Title</h1>
            <h2>Im Subtitle</h2>
            <! -- here will be list of tags -->
            <div class="flex flex-wrap gap-2">
              <div class="bg-green-400 px-3 p-0.5 rounded-sm text-sm">
                Tag 1
              </div>
            </div>
            <div id="synopsis" class="border-2 border-gray-400 w-full h-full">
              <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Quisquam, quod.
              </p>
            </div>
          </div>
        </div>
        <div class="bg-red-400 h-full">
          <div class="p-4">
            <div>Seasons And Episodes</div>
            <div class="gap-4 flex flex-col">
              <!-- here will be accordions using native html details and summary -->
              <details name="execlusive">
                <summary
                  class="list-none text-lg font-bold border-blue-300 border p-2"
                >
                  Season 1
                </summary>
                <div>
                  <!-- here will be list of episodes with items with borders and each ep will have encodings with play buttons like hevc webrip etc -->
                  <div class="flex gap-2 flex-col">
                    <div class="bg-blue-200 w-full p-2 flex flex-col gap-1">
                      <div class="flex w-full justify-between">
                        <h3>Episode 1</h3>
                        <button class="bg-blue-500 text-white p-1 text-sm">
                          Watched
                        </button>
                      </div>
                      <div>
                        <button class="bg-blue-500 text-white p-1 text-sm">
                          Play HEVC
                        </button>
                        <button class="bg-blue-500 text-white p-1 text-sm">
                          Play WEBRIP
                        </button>
                      </div>
                    </div>

                    <div class="bg-blue-200 w-full p-2 flex flex-col gap-1">
                      <div class="flex w-full justify-between">
                        <h3>Episode 2</h3>
                        <button class="bg-blue-500 text-white p-1 text-sm">
                          Watched
                        </button>
                      </div>
                      <div>
                        <button class="bg-blue-500 text-white p-1 text-sm">
                          Play HEVC
                        </button>
                        <button class="bg-blue-500 text-white p-1 text-sm">
                          Play WEBRIP
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </details>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
